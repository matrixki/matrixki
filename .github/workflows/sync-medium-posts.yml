# Fetch new Medium posts once a day and commit public/posts.json if it changed.
# The push triggers Vercel to rebuild and deploy the site.
# Can also be run by hand from the Actions tab right after publishing.
name: Sync Medium posts

on:
  schedule:
    - cron: '0 1 * * *' # daily at 01:00 UTC (09:00 Taipei)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The script only uses Node built-ins, so no npm install is needed.
      - name: Fetch Medium feed
        run: npm run fetch-posts

      - name: Commit posts.json if changed
        run: |
          if git diff --quiet public/posts.json; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/posts.json
          git commit -m "Sync Medium posts"
          git push
